<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OptionallyBlueStudios</title>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Pixelify+Sans:wght@400..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap');
        body {
            background-color: rgb(28, 27, 34);
            font-family: "Roboto", sans-serif;
            color: white;
            margin: 0;
            padding: 0;
        }
        
        .announcement {
            background-color: rgba(50, 50, 60, 0.8);
            padding: 15px;
            border-bottom: 2px solid #444;
            overflow: hidden;
            white-space: nowrap;
            position: relative;
            height: 50px;
            display: flex;
            align-items: center;
        }
        
        .announcement h3 {
            margin: 0;
            display: inline-block;
            font-size: 16px;
            line-height: 1.2;
            position: absolute;
            white-space: nowrap;
        }
        
        .announcement a {
            color: #64b5f6;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s ease;
        }
        
        .announcement a:hover {
            color: #90caf9;
            text-shadow: 0 0 5px rgba(100, 181, 246, 0.5);
        }
        
        .botd-link {
            color: #4fc3f7;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            transition: color 0.3s ease;
        }
        
        .botd-link:hover {
            color: #81d4fa;
            text-shadow: 0 0 8px rgba(79, 195, 247, 0.6);
        }
                
        .content {
            text-align: center;
            margin-top: 50px;
        }
                
        button {
            margin: 5px;
            background-color: grey;
            border-radius: 10px;
            height: 40px;
            width: 300px;
            border-color: black;
            color: white;
            font-family: "Pixelify Sans", sans-serif;
            font-size: 30px;
        }
    </style>
</head>
<body>
    <div class="announcement">
        <h3 id="announcement-text">Loading announcements...</h3>
    </div>
    <div class="content">
        <h1>OptionallyBlueStudios</h1>
        <br>
        <br>
        <button onclick="openpage('http://scangame.optb.qzz.io')" style="width: 500px; background-color: rgb(212, 77, 47);">[SOON] S.C.A.N.</button>
        <br>
        <button onclick="openpage('projects')" style="width: 420px;">Projects</button>
        <br>
        <button onclick="openpage('http://optb.short.gy/dsc')" style="width: 330px;">Disocrd</button>
        <br>
        <button onclick="openpage('about')" style="width: 250px;">About</button>
    </div>
    <script>
        function openpage(url) {
            window.location.href = url
        }
        async function loadAnnouncements() {
            try {
                // Replace this URL with your GitHack URL for the txt file
                // Example: https://githack.com/username/repo/raw/branch/announcements.txt
                const response = await fetch('https://rawcdn.githack.com/OptionallyBlueStudios/optionallybluestudios.github.io/refs/heads/main/storage/announcements.txt');
                
                if (!response.ok) {
                    throw new Error('Failed to load announcements');
                }
                
                const text = await response.text();
                const announcementElement = document.getElementById('announcement-text');
                
                // Process the text to make links clickable
                let processedText = text.trim();
                
                // Replace Battle Of The Devs with clickable link
                processedText = processedText.replace(
                    /Battle Of The Devs/g, 
                    '<a href="https://optionallybluestudios.github.io/Events/botd" class="botd-link">Battle Of The Devs</a>'
                );
                
                // Replace discord bot link
                processedText = processedText.replace(
                    /discord bot!/g, 
                    '<a href="https://optb.short.gy/annondm">discord bot!</a>'
                );
                
                // Replace discord join link
                processedText = processedText.replace(
                    /Join our discord!/g, 
                    '<a href="https://optb.short.gy/discord">Join our discord!</a>'
                );
                
                announcementElement.innerHTML = processedText;
                
                // Start scrolling after content is loaded
                startScrolling();
                
            } catch (error) {
                console.error('Error loading announcements:', error);
                const announcementElement = document.getElementById('announcement-text');
                announcementElement.innerHTML = '<h3>Loading announcements.. Please stand by. If this is taking too long, please check your internet connection and GitHack status before reaching out to the developers to report an issue.</h3>';
                startScrolling();
            }
        }
        
        function startScrolling() {
            const announcement = document.querySelector('.announcement h3');
            const container = document.querySelector('.announcement');
            
            // Start from the right side of the container
            let position = container.offsetWidth;
            
            function scroll() {
                // Move the text to the left
                position -= 1;
                announcement.style.left = position + 'px';
                
                // Reset position when text completely disappears on the left
                if (position < -announcement.offsetWidth) {
                    position = container.offsetWidth;
                }
                
                // Continue animation
                requestAnimationFrame(scroll);
            }
            
            // Start the scrolling animation
            scroll();
        }
        
        // Load announcements when page loads
        window.addEventListener('load', loadAnnouncements);
        // Create audio objects for sounds
const hoverSound = new Audio('sounds/hover.wav');
const clickSound = new Audio('sounds/click.wav');

// Set volume (optional)
hoverSound.volume = 0.3;
clickSound.volume = 0.5;

// Get all buttons
const buttons = document.querySelectorAll('button');

// Add event listeners to each button
buttons.forEach(button => {
    // Hover effect
    button.addEventListener('mouseenter', () => {
        button.style.transform = 'scale(1.1)';
        button.style.boxShadow = '0 4px 15px rgba(255, 255, 255, 0.2)';
        button.style.transition = 'transform 0.3s ease, box-shadow 0.3s ease';
        
        // Play hover sound
        hoverSound.currentTime = 0; // Reset sound to beginning
        hoverSound.play().catch(e => console.log('Hover sound failed:', e));
    });
    
    // Remove hover effect
    button.addEventListener('mouseleave', () => {
        button.style.transform = 'scale(1)';
        button.style.boxShadow = 'none';
    });
    
    // Click effect
    button.addEventListener('mousedown', () => {
        button.style.transform = 'scale(1.05)';
    });
    
    // Click sound and reset scale
    button.addEventListener('click', () => {
        // Play click sound
        clickSound.currentTime = 0;
        clickSound.play().catch(e => console.log('Click sound failed:', e));
        
        // Reset to hover scale
        setTimeout(() => {
            button.style.transform = 'scale(1.1)';
        }, 100);
    });
});
    </script>
</body>
</html>
