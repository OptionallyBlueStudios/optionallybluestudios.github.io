<!DOCTYPE html>

    </script>
    <title>OptionallyBlueStudios</title>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Pixelify+Sans:wght@400..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap');
        body {
            background-color: rgb(28, 27, 34);
            font-family: "Roboto", sans-serif;
            color: white;
            margin: 0;
            padding: 0;
        }
        
        .announcement {
            background-color: rgba(50, 50, 60, 0.8);
            padding: 15px;
            border-bottom: 2px solid #444;
            overflow: hidden;
            white-space: nowrap;
            position: relative;
            height: 50px;
            display: flex;
            align-items: center;
        }
        
        .announcement h3 {
            margin: 0;
            display: inline-block;
            font-size: 16px;
            line-height: 1.2;
            position: absolute;
            white-space: nowrap;
        }
        
        .announcement a {
            color: #64b5f6;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s ease;
        }
        
        .announcement a:hover {
            color: #90caf9;
            text-shadow: 0 0 5px rgba(100, 181, 246, 0.5);
        }
        
        .botd-link {
            color: #4fc3f7;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            transition: color 0.3s ease;
        }
        
        .botd-link:hover {
            color: #81d4fa;
            text-shadow: 0 0 8px rgba(79, 195, 247, 0.6);
        }
                
        .content {
            text-align: center;
            margin-top: 50px;
        }
                
        button {
            margin: 5px;
            background-color: grey;
            border-radius: 10px;
            height: 40px;
            width: 300px;
            border-color: black;
            color: white;
            font-family: "Pixelify Sans", sans-serif;
            font-size: 30px;
        }

        .staff-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            width: auto;
            min-width: 140px;
            padding: 0 18px;
            font-size: 20px;
            height: 46px;
            background: linear-gradient(135deg, #5d6dff, #3f51b5);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .staff-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 20px;
        }

        .staff-modal.active {
            display: flex;
        }

        .staff-modal-card {
            width: min(460px, 100%);
            background: #23222c;
            border: 2px solid #4b4b63;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 14px 35px rgba(0, 0, 0, 0.35);
        }

        .staff-modal-card h2 {
            margin-top: 0;
            margin-bottom: 10px;
            font-family: "Pixelify Sans", sans-serif;
        }

        .staff-modal-card p {
            margin-top: 0;
            margin-bottom: 16px;
            color: #d8d8e0;
        }

        .staff-modal-card input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #6a6a84;
            background: #15151b;
            color: #fff;
            margin-bottom: 12px;
            box-sizing: border-box;
        }

        .staff-modal-card button {
            width: 100%;
            height: 42px;
            font-size: 20px;
            margin: 4px 0;
        }

        .staff-menu {
            position: fixed;
            bottom: 80px;
            right: 20px;
            background: #23222c;
            border: 1px solid #4b4b63;
            border-radius: 12px;
            padding: 10px;
            min-width: 240px;
            display: none;
            z-index: 1500;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.25);
        }

        .staff-menu.active {
            display: block;
        }

        .staff-menu a {
            display: block;
            color: #8ec5ff;
            text-decoration: none;
            padding: 8px 6px;
            border-radius: 6px;
        }

        .staff-menu a:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .staff-menu .note {
            font-size: 13px;
            color: #b7b7c2;
            padding: 6px;
        }
    </style>
</head>
<body>
    <div class="announcement">
        <h3 id="announcement-text">Loading announcements...</h3>
    </div>
    <div class="content">
        <h1>OptionallyBlueStudios</h1>
        <br>
        <br>
        <button onclick="openpage('http://scangame.optb.qzz.io')" style="width: 500px; background-color: rgb(212, 77, 47);">[SOON] S.C.A.N.</button>
        <br>
        <button onclick="openpage('projects')" style="width: 420px;">Projects</button>
        <br>
        <button onclick="openpage('http://optb.short.gy/dsc')" style="width: 330px;">Disocrd</button>
        <br>
        <button onclick="openpage('about')" style="width: 250px;">About</button>
    </div>

    <button id="staff-access-button" class="staff-button" type="button" style="display: none;">Staff</button>
    <div id="staff-modal" class="staff-modal" role="dialog" aria-modal="true" aria-labelledby="staff-modal-title">
        <div class="staff-modal-card">
            <h2 id="staff-modal-title">Staff access</h2>
            <p>Please enter your staff access code.</p>
            <input id="staff-code-input" type="password" placeholder="Enter access code" autocomplete="off" />
            <button id="staff-submit-button" type="button">Unlock</button>
            <button id="staff-close-button" type="button">Cancel</button>
        </div>
    </div>
    <div id="staff-menu" class="staff-menu"></div>

    <script>
        function openpage(url) {
            window.location.href = url
        }
        async function loadAnnouncements() {
            try {
                // Replace this URL with your GitHack URL for the txt file
                // Example: https://githack.com/username/repo/raw/branch/announcements.txt
                const response = await fetch('https://rawcdn.githack.com/OptionallyBlueStudios/optionallybluestudios.github.io/refs/heads/main/storage/announcements.txt');
                
                if (!response.ok) {
                    throw new Error('Failed to load announcements');
                }
                
                const text = await response.text();
                const announcementElement = document.getElementById('announcement-text');
                
                // Process the text to make links clickable
                let processedText = text.trim();
                
                // Replace Battle Of The Devs with clickable link
                processedText = processedText.replace(
                    /Battle Of The Devs/g, 
                    '<a href="https://optionallybluestudios.github.io/Events/botd" class="botd-link">Battle Of The Devs</a>'
                );
                
                // Replace discord bot link
                processedText = processedText.replace(
                    /discord bot!/g, 
                    '<a href="https://optb.short.gy/annondm">discord bot!</a>'
                );
                
                // Replace discord join link
                processedText = processedText.replace(
                    /Join our discord!/g, 
                    '<a href="https://optb.short.gy/discord">Join our discord!</a>'
                );
                
                announcementElement.innerHTML = processedText;
                
                // Start scrolling after content is loaded
                startScrolling();
                
            } catch (error) {
                console.error('Error loading announcements:', error);
                const announcementElement = document.getElementById('announcement-text');
                announcementElement.innerHTML = '<h3>Loading announcements.. Please stand by. If this is taking too long, please check your internet connection and GitHack status before reaching out to the developers to report an issue.</h3>';
                startScrolling();
            }
        }
        
        function startScrolling() {
            const announcement = document.querySelector('.announcement h3');
            const container = document.querySelector('.announcement');
            
            // Start from the right side of the container
            let position = container.offsetWidth;
            
            function scroll() {
                // Move the text to the left
                position -= 1;
                announcement.style.left = position + 'px';
                
                // Reset position when text completely disappears on the left
                if (position < -announcement.offsetWidth) {
                    position = container.offsetWidth;
                }
                
                // Continue animation
                requestAnimationFrame(scroll);
            }
            
            // Start the scrolling animation
            scroll();
        }
        
        // Load announcements when page loads
        window.addEventListener('load', loadAnnouncements);
        // Create audio objects for sounds
const hoverSound = new Audio('sounds/hover.wav');
const clickSound = new Audio('sounds/click.wav');

// Set volume (optional)
hoverSound.volume = 0.3;
clickSound.volume = 0.5;

// Get all buttons
const buttons = document.querySelectorAll('button');

// Add event listeners to each button
buttons.forEach(button => {
    // Hover effect
    button.addEventListener('mouseenter', () => {
        button.style.transform = 'scale(1.1)';
        button.style.boxShadow = '0 4px 15px rgba(255, 255, 255, 0.2)';
        button.style.transition = 'transform 0.3s ease, box-shadow 0.3s ease';
        
        // Play hover sound
        hoverSound.currentTime = 0; // Reset sound to beginning
        hoverSound.play().catch(e => console.log('Hover sound failed:', e));
    });
    
    // Remove hover effect
    button.addEventListener('mouseleave', () => {
        button.style.transform = 'scale(1)';
        button.style.boxShadow = 'none';
    });
    
    // Click effect
    button.addEventListener('mousedown', () => {
        button.style.transform = 'scale(1.05)';
    });
    
    // Click sound and reset scale
    button.addEventListener('click', () => {
        // Play click sound
        clickSound.currentTime = 0;
        clickSound.play().catch(e => console.log('Click sound failed:', e));
        
        // Reset to hover scale
        setTimeout(() => {
            button.style.transform = 'scale(1.1)';
        }, 100);
    });
});

const STAFF_ACCESS_CODE = 'El987695231569562_';
const STAFF_PAYLOAD_URL = 'staff-links-encrypted.json';

function decryptPayload(value, key) {
    const binary = atob(value);
    let output = '';

    for (let i = 0; i < binary.length; i += 1) {
        const byte = binary.charCodeAt(i);
        const keyChar = key.charCodeAt(i % key.length);
        output += String.fromCharCode(byte ^ keyChar);
    }

    return output;
}

function showStaffModal() {
    if (window.location.hash !== '#staff-login') {
        return;
    }

    document.getElementById('staff-modal').classList.add('active');
    document.getElementById('staff-code-input').focus();
}

function hideStaffModal() {
    document.getElementById('staff-modal').classList.remove('active');
}

function renderStaffMenu(entries) {
    const menu = document.getElementById('staff-menu');
    menu.innerHTML = '';
    const title = document.createElement('div');
    title.textContent = 'Staff links';
    title.style.fontWeight = 'bold';
    title.style.marginBottom = '6px';
    menu.appendChild(title);

    entries.forEach(entry => {
        const link = document.createElement('a');
        link.href = entry.url;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.textContent = entry.label;
        menu.appendChild(link);

        if (entry.note) {
            const note = document.createElement('div');
            note.className = 'note';
            note.textContent = entry.note;
            menu.appendChild(note);
        }
    });
}

async function openStaffMenu() {
    try {
        const response = await fetch(STAFF_PAYLOAD_URL);
        if (!response.ok) {
            throw new Error('Failed to load encrypted staff payload');
        }

        const payloadFile = await response.json();
        const decrypted = decryptPayload(payloadFile.payload, STAFF_ACCESS_CODE);
        const parsed = JSON.parse(decrypted);
        renderStaffMenu(parsed.entries || []);
        document.getElementById('staff-menu').classList.toggle('active');
    } catch (error) {
        console.error('Failed to load staff links', error);
        alert('Staff links could not be loaded.');
    }
}

function handleStaffUnlock() {
    const input = document.getElementById('staff-code-input');
    if (input.value === STAFF_ACCESS_CODE) {
        hideStaffModal();
        openStaffMenu();
    } else {
        alert('Incorrect staff access code.');
    }
}

function openStaffAccess() {
    const button = document.getElementById('staff-access-button');
    if (window.location.hash === '#staff-login') {
        button.style.display = 'block';
    } else {
        button.style.display = 'none';
        hideStaffModal();
    }
}

document.getElementById('staff-access-button').addEventListener('click', () => {
    showStaffModal();
});
document.getElementById('staff-submit-button').addEventListener('click', handleStaffUnlock);
document.getElementById('staff-close-button').addEventListener('click', hideStaffModal);
document.getElementById('staff-code-input').addEventListener('keydown', (event) => {
    if (event.key === 'Enter') {
        handleStaffUnlock();
    }
});
document.getElementById('staff-modal').addEventListener('click', (event) => {
    if (event.target.id === 'staff-modal') {
        hideStaffModal();
    }
});
window.addEventListener('hashchange', openStaffAccess);
window.addEventListener('load', () => {
    openStaffAccess();
});
    </script>
</body>
</html>
